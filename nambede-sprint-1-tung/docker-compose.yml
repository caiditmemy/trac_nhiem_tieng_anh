name: nambede-sprint1-tung

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sprint_tung
      POSTGRES_PASSWORD: Local-tung-123
      POSTGRES_DB: postgres
    # The database and auth-service listen on 127.0.0.1 only: this computer can still call them directly (Swagger of
    # auth-service), all published ports are isolated and bound to loopback.
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 on purpose: during first-start init the temporary server only
      # listens on the unix socket, so a socket check would pass before the DBs exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  auth-service:
    build:
      context: ./services/auth-service
      args:
        SKIP_TESTS: ${SKIP_TESTS:-false}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_tung
      SPRING_DATASOURCE_USERNAME: sprint_tung
      SPRING_DATASOURCE_PASSWORD: Local-tung-123
      # RS256: the key pair is made on the first start and kept in auth_tung.signing_keys, nothing to set
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      ADMIN_EMAIL: admin@tung.local
      ADMIN_PASSWORD: LocalAdmin@123
    ports:
      - "127.0.0.1:8103:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  gateway:
    build: ./services/gateway
    environment:
      # auth-service's public keys: tokens are verified here (RS256), never signed
      JWKS_URL: http://auth-service:8081/.well-known/jwks.json
      AUTH_SERVICE_URL: http://auth-service:8081
      CORS_ORIGINS: http://127.0.0.1:5173
    ports:
      - "127.0.0.1:8203:8000"
    # Only start order: the gateway must keep running when a service is down (it answers 502)
    depends_on:
      auth-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # nginx serves the React build and forwards /api to this project gateway
  web:
    build: ./web
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  pgdata: {}
