# GitLab CI for NamBeDe (Sprint 1 - Nam). Every part of the system is built and tested in its own job, with the same images
# as the Dockerfiles, and a job runs only when its folder (or this file) changes.
# Run one job on your own machine with Docker: npx gitlab-ci-local <job name>

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never # the merge request pipeline already covers this push
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

# Spring Boot service: compile, unit tests (no database needed), package the jar
.spring-service:
  image: eclipse-temurin:17-jdk-noble
  variables:
    MAVEN_USER_HOME: $CI_PROJECT_DIR/.m2
  cache:
    key: maven-$SERVICE
    paths:
      - .m2/
  script:
    - cd services/$SERVICE
    - ./mvnw -B -ntp -Dmaven.repo.local=$MAVEN_USER_HOME/repository verify
  artifacts:
    when: always
    paths:
      - services/*/target/site/jacoco/
    reports:
      junit: services/*/target/surefire-reports/TEST-*.xml

auth-service:
  extends: .spring-service
  variables:
    SERVICE: auth-service
  rules:
    - changes: [services/auth-service/**/*, .gitlab-ci.yml]

class-service:
  extends: .spring-service
  variables:
    SERVICE: class-service
  rules:
    - changes: [services/class-service/**/*, .gitlab-ci.yml]

# FastAPI gateway: install exactly what uv.lock pins, then pytest
.python-service:
  image: ghcr.io/astral-sh/uv:0.12.21-python3.12-trixie-slim
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
    UV_LINK_MODE: copy
    UV_PYTHON_DOWNLOADS: never
  cache:
    key: uv-$SERVICE
    paths:
      - .uv-cache/
  script:
    - cd services/$SERVICE
    - uv build --out-dir dist
    - uv run --locked pytest -q --junitxml=report.xml
    - uv cache prune --ci
  artifacts:
    when: always
    reports:
      junit: services/*/report.xml

gateway:
  extends: .python-service
  variables:
    SERVICE: gateway
  rules:
    - changes: [services/gateway/**/*, .gitlab-ci.yml]

# React web: lint, unit tests (Vitest), type check and production build
web:
  image: node:24-alpine
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/.npm/
  script:
    - cd web
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run lint
    - npm test
    - npm run build
  rules:
    - changes: [web/**/*, .gitlab-ci.yml]

# Real full-stack integration; internal service names avoid published-port assumptions.
system-test:
  tags: [dind]
  image: docker:28
  services:
    - name: docker:28-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  timeout: 30m
  script:
    - docker compose up -d --build --wait
    - docker compose cp scripts/. gateway:/tmp/sprint1-nam
    - docker compose exec -T gateway python /tmp/sprint1-nam/smoke.py --api http://web/api --auth http://auth-service:8081
  after_script:
    - docker compose logs --no-color > compose.log
    - docker compose down
  artifacts:
    when: always
    expire_in: 1 week
    paths: [compose.log]
  rules:
    - changes: [services/**/*, web/**/*, scripts/**/*, docker-compose.yml, infra/**/*, .gitlab-ci.yml]

launcher-safety:
  image: python:3.12-slim
  script:
    - python -m unittest discover -s scripts -p 'test_*.py'
  rules:
    - changes: [scripts/**/*, .gitlab-ci.yml]
